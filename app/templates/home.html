<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#f4efe6" />
  <meta name="description" content="Minimalist PWA to calculate filament and energy costs for 3D printing." />
  <link rel="manifest" href="{{ url_for('static', filename='manifest.json') }}" />
  <link rel="icon" href="{{ url_for('static', filename='icons/icon-192.svg') }}" type="image/svg+xml" />
  <title>3D Cost Calculator</title>

  <style>
    :root {
      --bg: #f4efe6;
      --surface: rgba(255, 252, 246, 0.84);
      --surface-strong: #fffdf8;
      --ink: #1e1b18;
      --muted: #6e655c;
      --line: rgba(64, 52, 42, 0.12);
      --accent: #d97706;
      --accent-soft: #f3c98b;
      --energy: #2f6f62;
      --shadow: 0 28px 90px rgba(68, 46, 19, 0.16);
      --radius-xl: 32px;
      --radius-lg: 22px;
      --radius-md: 16px;
      --transition: 220ms ease;
    }

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Avenir Next", "Segoe UI", sans-serif;
      color: var(--ink);
      background:
        radial-gradient(circle at top left, rgba(232, 176, 88, 0.28), transparent 30%),
        radial-gradient(circle at bottom right, rgba(69, 131, 117, 0.18), transparent 32%),
        linear-gradient(160deg, #f6f1e8 0%, #efe8dc 100%);
      display: grid;
      place-items: center;
      padding: 24px;
    }

    body::before,
    body::after {
      content: "";
      position: fixed;
      z-index: 0;
      border-radius: 999px;
      filter: blur(10px);
      pointer-events: none;
    }

    body::before {
      width: 260px;
      height: 260px;
      top: -90px;
      right: -70px;
      background: rgba(217, 119, 6, 0.18);
    }

    body::after {
      width: 220px;
      height: 220px;
      bottom: -70px;
      left: -60px;
      background: rgba(47, 111, 98, 0.16);
    }

    .shell {
      position: relative;
      z-index: 1;
      width: min(100%, 460px);
      background: var(--surface);
      backdrop-filter: blur(18px);
      border: 1px solid rgba(255, 255, 255, 0.55);
      border-radius: var(--radius-xl);
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .shell::after {
      content: "";
      position: absolute;
      inset: auto 0 0 0;
      height: 5px;
      background: linear-gradient(90deg, var(--accent) 0%, #f4d399 45%, var(--energy) 100%);
    }

    .layout {
      min-height: 100vh;
    }

    .calculator {
      padding: 28px;
      display: flex;
      flex-direction: column;
      gap: 22px;
      background:
        linear-gradient(180deg, rgba(255, 255, 255, 0.3), rgba(255, 255, 255, 0.08)),
        linear-gradient(150deg, rgba(255, 231, 196, 0.48), rgba(255, 255, 255, 0));
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      width: fit-content;
      padding: 8px 12px;
      border-radius: 999px;
      background: rgba(255, 253, 248, 0.85);
      border: 1px solid rgba(217, 119, 6, 0.16);
      color: var(--muted);
      font-size: 0.78rem;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    .eyebrow::before {
      content: "";
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 0 6px rgba(217, 119, 6, 0.12);
    }

    .panel-head h2 {
      margin: 12px 0 0;
      font-size: 1.35rem;
      letter-spacing: -0.04em;
    }

    .panel-head {
      display: grid;
      gap: 10px;
    }

    form {
      display: grid;
      gap: 14px;
    }

    .field {
      display: grid;
      gap: 6px;
    }

    label {
      font-size: 0.86rem;
      color: var(--muted);
      font-weight: 600;
    }

    .label-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .formula-toggle {
      width: 28px;
      height: 28px;
      border: 1px solid rgba(64, 52, 42, 0.08);
      border-radius: 999px;
      background: rgba(255, 253, 248, 0.86);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 0.95rem;
      cursor: pointer;
      transition: transform var(--transition), box-shadow var(--transition), border-color var(--transition);
    }

    .formula-toggle:hover,
    .formula-toggle:focus-visible {
      transform: translateY(-1px);
      border-color: rgba(217, 119, 6, 0.24);
      box-shadow: 0 0 0 4px rgba(217, 119, 6, 0.1);
      outline: none;
    }

    .formula-card {
      display: none;
      padding: 14px 16px;
      border-radius: 16px;
      background: rgba(255, 252, 246, 0.9);
      border: 1px solid rgba(64, 52, 42, 0.08);
      color: var(--muted);
      font-size: 0.84rem;
      line-height: 1.55;
    }

    .formula-card.open {
      display: block;
    }

    .formula-card strong {
      display: block;
      margin-bottom: 6px;
      color: var(--ink);
      font-size: 0.9rem;
    }

    .formula-card code {
      display: block;
      margin-top: 6px;
      padding: 10px 12px;
      border-radius: 12px;
      background: rgba(255, 248, 237, 0.95);
      color: var(--ink);
      font-size: 0.82rem;
      word-break: break-word;
    }

    .input-wrap {
      position: relative;
    }

    .input-wrap.select-wrap::after {
      content: "";
      position: absolute;
      right: 18px;
      top: 50%;
      width: 10px;
      height: 10px;
      border-right: 2px solid rgba(30, 27, 24, 0.42);
      border-bottom: 2px solid rgba(30, 27, 24, 0.42);
      transform: translateY(-70%) rotate(45deg);
      pointer-events: none;
    }

    .prefix {
      position: absolute;
      left: 16px;
      top: 50%;
      transform: translateY(-50%);
      color: rgba(30, 27, 24, 0.42);
      font-size: 0.96rem;
      pointer-events: none;
    }

    input,
    select {
      width: 100%;
      border: 1px solid transparent;
      border-radius: var(--radius-md);
      background: var(--surface-strong);
      color: var(--ink);
      padding: 18px 18px 18px 48px;
      font-size: 1rem;
      transition: border-color var(--transition), box-shadow var(--transition), transform var(--transition);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.6);
    }

    select {
      appearance: none;
      padding-right: 44px;
    }

    input:focus,
    select:focus {
      outline: none;
      border-color: rgba(217, 119, 6, 0.42);
      box-shadow: 0 0 0 4px rgba(217, 119, 6, 0.12);
      transform: translateY(-1px);
    }

    input:disabled,
    select:disabled {
      color: rgba(30, 27, 24, 0.45);
      background: rgba(255, 253, 248, 0.7);
      cursor: not-allowed;
      box-shadow: none;
    }

    .toggle-row {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 4px 2px 0;
      color: var(--muted);
      font-size: 0.9rem;
      user-select: none;
    }

    .toggle-row input {
      width: 18px;
      height: 18px;
      margin: 0;
      padding: 0;
      accent-color: var(--accent);
      box-shadow: none;
      transform: none;
    }

    .toggle-row label {
      font-size: 0.9rem;
      color: var(--muted);
      font-weight: 500;
      cursor: pointer;
    }

    .summary {
      display: grid;
      gap: 12px;
      padding: 18px;
      border-radius: 24px;
      background: rgba(255, 252, 246, 0.82);
      border: 1px solid rgba(64, 52, 42, 0.08);
    }

    .result {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 14px 0;
      border-bottom: 1px solid rgba(64, 52, 42, 0.08);
    }

    .result:last-child {
      border-bottom: 0;
      padding-bottom: 0;
    }

    .result:first-child {
      padding-top: 0;
    }

    .result-label {
      display: flex;
      align-items: center;
      gap: 12px;
      font-weight: 600;
    }

    .chip {
      width: 11px;
      height: 11px;
      border-radius: 50%;
    }

    .chip.filament {
      background: var(--accent);
      box-shadow: 0 0 0 7px rgba(217, 119, 6, 0.12);
    }

    .chip.energy {
      background: var(--energy);
      box-shadow: 0 0 0 7px rgba(47, 111, 98, 0.12);
    }

    .result strong,
    .total strong {
      font-size: 1.02rem;
      letter-spacing: -0.02em;
    }

    .total {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-top: 6px;
      padding: 18px 20px;
      border-radius: 20px;
      background: linear-gradient(135deg, #fff0d8, #fffaf1 55%, #edf7f4);
      border: 1px solid rgba(64, 52, 42, 0.08);
    }

    .total span {
      display: block;
      color: var(--muted);
      font-size: 0.86rem;
      margin-top: 3px;
    }

    .total strong {
      font-size: clamp(1.55rem, 3vw, 2rem);
    }

    @media (max-width: 580px) {
      body {
        padding: 10px;
      }

      .calculator {
        padding: 22px 18px 20px;
      }

      .summary,
      .total {
        border-radius: 18px;
      }

      .shell {
        border-radius: 24px;
      }
    }
  </style>
</head>

<body>
  <main class="shell">
    <section class="layout">
      <section class="calculator" aria-label="Cost calculator">
        <header class="panel-head">
          <span class="eyebrow">3D Cost Calculator</span>
          <h2>Print simulation</h2>
        </header>

        <form>
          <div class="field">
            <label for="filamento">Filament length</label>
            <div class="input-wrap">
              <span class="prefix">m</span>
              <input id="filamento" type="text" inputmode="decimal" autocomplete="off" placeholder="12,50" />
            </div>
          </div>

          <div class="field">
            <label for="tipoFilamento">Filament</label>
            <div class="input-wrap select-wrap">
              <span class="prefix">#</span>
              <select id="tipoFilamento">
                <option value="black-tpu">Black TPU</option>
                <option value="black-velvet-pla">Black Velvet PLA</option>
                <option value="dual-color-pla">Dual Color PLA</option>
                <option value="granito-pla">Granito PLA</option>
              </select>
            </div>
          </div>

          <div class="toggle-row">
            <input id="manualPrice" type="checkbox" />
            <label for="manualPrice">Input price manually</label>
          </div>

          <div class="field">
            <label for="valorFilamento">Spool price</label>
            <div class="input-wrap">
              <span class="prefix">$</span>
              <input id="valorFilamento" type="text" inputmode="decimal" autocomplete="off" placeholder="149,90" />
            </div>
          </div>

          <div class="field">
            <div class="label-row">
              <label for="horas">Printing time</label>
              <button
                id="formulaToggle"
                class="formula-toggle"
                type="button"
                aria-expanded="false"
                aria-controls="formulaCard"
                title="Show formula"
              >🧮</button>
            </div>
            <div id="formulaCard" class="formula-card" aria-hidden="true">
              <strong>Energy formula</strong>
              Power: 0.35 kWh
              <br />
              Price: R$ 1,20 per kWh
              <code>energy cost = hours × 0.35 × 1.20</code>
            </div>
            <div class="input-wrap">
              <span class="prefix">h</span>
              <input id="horas" type="text" inputmode="decimal" autocomplete="off" placeholder="4,80" />
            </div>
          </div>
        </form>

        <section class="summary" aria-live="polite">
          <div class="result">
            <div class="result-label">
              <span class="chip filament"></span>
              <span>Filament cost</span>
            </div>
            <strong id="gastoFilamento">R$ 0,00</strong>
          </div>

          <div class="result">
            <div class="result-label">
              <span class="chip energy"></span>
              <span>Energy cost</span>
            </div>
            <strong id="gastoEnergia">R$ 0,00</strong>
          </div>

          <div class="total">
            <div>
              <strong>Total</strong>
              <span>Filament + energy</span>
            </div>
            <strong id="total">R$ 0,00</strong>
          </div>
        </section>
      </section>
    </section>
  </main>

  <script>
    const potenciaImpressora = 0.35;
    const precoPorKwh = 1.2;
    const filamentos = {
      "black-tpu": { nome: "Black TPU", preco: 149.90, metros: 360 },
      "black-velvet-pla": { nome: "Black Velvet PLA", preco: 105.44, metros: 333 },
      "dual-color-pla": { nome: "Dual Color PLA", preco: 132, metros: 333 },
      "granito-pla": { nome: "Granito PLA", preco: 122, metros: 333 }
    };

    const filamentoInput = document.getElementById("filamento");
    const tipoFilamentoInput = document.getElementById("tipoFilamento");
    const manualPriceInput = document.getElementById("manualPrice");
    const valorFilamentoInput = document.getElementById("valorFilamento");
    const horasInput = document.getElementById("horas");
    const formulaToggle = document.getElementById("formulaToggle");
    const formulaCard = document.getElementById("formulaCard");
    const gastoFilamento = document.getElementById("gastoFilamento");
    const gastoEnergia = document.getElementById("gastoEnergia");
    const total = document.getElementById("total");

    const formatarMoeda = (valor) =>
      valor.toLocaleString("pt-BR", {
        style: "currency",
        currency: "BRL"
      });

    const inputsNumericos = [filamentoInput, valorFilamentoInput, horasInput];

    const formatarEntrada = (valor) =>
      valor.toLocaleString("pt-BR", {
        minimumFractionDigits: 0,
        maximumFractionDigits: 2
      });

    const normalizarNumero = (valor) => {
      const texto = String(valor).trim().replace(/\s+/g, "").replace(",", ".");
      return Number(texto) || 0;
    };

    function permitirVirgula(input) {
      input.addEventListener("input", () => {
        const limpo = input.value.replace(/[^0-9,.\s]/g, "").replace(/\s+/g, "");
        const separador = limpo.match(/[.,]/);

        if (!separador) {
          input.value = limpo;
          return;
        }

        const indice = separador.index;
        const inteiro = limpo.slice(0, indice).replace(/[.,]/g, "");
        const decimal = limpo.slice(indice + 1).replace(/[.,]/g, "");

        input.value = `${inteiro}${separador[0]}${decimal}`;
      });
    }

    function obterFilamentoSelecionado() {
      return filamentos[tipoFilamentoInput.value] || filamentos["black-tpu"];
    }

    function sincronizarModoPreco() {
      const manual = manualPriceInput.checked;
      const filamentoSelecionado = obterFilamentoSelecionado();

      tipoFilamentoInput.disabled = manual;
      valorFilamentoInput.disabled = !manual;

      if (!manual) {
        valorFilamentoInput.value = formatarEntrada(filamentoSelecionado.preco);
      } else if (!valorFilamentoInput.value) {
        valorFilamentoInput.value = formatarEntrada(filamentoSelecionado.preco);
      }
    }

    function calcular() {
      const metros = normalizarNumero(filamentoInput.value);
      const manual = manualPriceInput.checked;
      const filamentoSelecionado = obterFilamentoSelecionado();
      const precoRolo = manual ? normalizarNumero(valorFilamentoInput.value) : filamentoSelecionado.preco;
      const metrosPorRolo = manual ? 360 : filamentoSelecionado.metros;
      const horas = normalizarNumero(horasInput.value);

      const custoFilamento = metrosPorRolo > 0 ? (metros * precoRolo) / metrosPorRolo : 0;
      const custoEnergia = horas * potenciaImpressora * precoPorKwh;
      const custoTotal = custoFilamento + custoEnergia;

      gastoFilamento.textContent = formatarMoeda(custoFilamento);
      gastoEnergia.textContent = formatarMoeda(custoEnergia);
      total.textContent = formatarMoeda(custoTotal);
    }

    inputsNumericos.forEach((input) => {
      permitirVirgula(input);
      ["input", "change"].forEach((evento) => {
        input.addEventListener(evento, calcular);
      });
    });

    tipoFilamentoInput.addEventListener("change", () => {
      sincronizarModoPreco();
      calcular();
    });

    manualPriceInput.addEventListener("change", () => {
      sincronizarModoPreco();
      calcular();
    });

    formulaToggle.addEventListener("click", () => {
      const aberto = formulaCard.classList.toggle("open");
      formulaToggle.setAttribute("aria-expanded", String(aberto));
      formulaCard.setAttribute("aria-hidden", String(!aberto));
    });

    tipoFilamentoInput.value = "black-tpu";
    sincronizarModoPreco();
    calcular();

    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("{{ url_for('static', filename='sw.js') }}");
      });
    }
  </script>
</body>
</html>
